<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hassan’s house · design frames</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5dfd3;color:#343b39;font:15px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#eee6d7;border-bottom:1px solid #b4b2a7;padding:20px 32px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font:600 24px Georgia;margin:0}header p{margin:0;font-size:12px}input,select,button,a.action{font:inherit;padding:9px 12px;background:#f4ecdd;color:inherit;border:1px solid #aba99e;border-radius:6px}button,a{cursor:pointer}a{color:inherit}input{min-width:220px}main{padding:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px}.card{background:#f4ecdd;border:1px solid #b4b2a7;border-radius:8px;overflow:hidden}.card button{display:block;width:100%;border:0;border-radius:0;padding:0;background:#d8d4cb;height:260px;overflow:hidden}.card img{width:100%;height:100%;object-fit:cover;object-position:top}.card.mobile img{object-fit:contain}.meta{padding:16px}.meta h2{font-size:16px;margin:0 0 4px}.meta p{margin:0 0 12px;font-size:12px;color:#62655d}.meta nav{display:flex;gap:14px;font-size:12px}dialog{padding:0;width:96vw;max-width:none;height:94vh;max-height:none;background:#d8d4cb;border:1px solid #62655d;border-radius:10px;color:#343b39}dialog::backdrop{background:#172f30bb}.tools{padding:12px 20px;background:#eee6d7;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tools strong{margin-right:auto}.stage{overflow:auto;height:calc(100% - 75px);padding:24px;display:block;text-align:center}.stage img{display:block;margin:auto;max-width:none;box-shadow:0 5px 25px #172f3033}button:focus-visible,a:focus-visible{outline:3px solid #774c65;outline-offset:3px}.empty{grid-column:1/-1}.count{font-size:12px}@media(max-width:600px){header,main{padding:16px}.tools{padding:8px}.stage{padding:8px}header input{min-width:0;width:100%}}
</style>
<header><div><h1>Hassan’s house / design frames</h1><p>Static implementation reference · desktop 1440px / mobile 390px</p></div><input id="query" aria-label="Find a page" placeholder="Find a page or state…"><select id="device" aria-label="Viewport"><option value="desktop">Desktop</option><option value="mobile">Mobile</option><option value="all">Both sizes</option></select><span class="count"></span></header><main></main>
<dialog><div class="tools"><strong id="title"></strong><button id="previous" aria-label="Previous frame">←</button><button id="next" aria-label="Next frame">→</button><select id="zoom" aria-label="Zoom"><option value="fit">Fit width</option><option value=".5">50%</option><option value="1">100% / actual pixels</option><option value="1.5">150%</option><option value="2">200%</option></select><a id="png" class="action" target="_blank">Open PNG</a><a id="spec" class="action" target="_blank">Measurements</a><button id="close">Close ×</button></div><div class="stage"><img alt=""></div></dialog>
<script>
const data=/* FRAME_DATA */;
const $=s=>document.querySelector(s);let visible=[],current=0;
function render(){visible=data.frames.filter(f=>($('#device').value==='all'||f.device===$('#device').value)&&(f.title+' '+f.route+' '+f.id).toLowerCase().includes($('#query').value.toLowerCase()));$('main').replaceChildren();$('.count').textContent=visible.length+' frames';visible.forEach((f,i)=>{const card=document.createElement('article');card.className='card '+f.device;const button=document.createElement('button');button.setAttribute('aria-label','View '+f.title+' '+f.device);const img=new Image();img.src=f.thumbnail;img.alt='';img.loading='lazy';button.append(img);button.onclick=()=>open(i);const meta=document.createElement('div');meta.className='meta';const title=document.createElement('h2');title.textContent=f.title;const p=document.createElement('p');p.textContent=f.device+' · '+f.width+' × '+f.height+' px';const nav=document.createElement('nav');for(const [label,url] of [['PNG',f.file],['Measurements',f.file.replace('.png','.json')],['Live interaction',f.live]]){const a=document.createElement('a');a.textContent=label;a.href=url;a.target='_blank';nav.append(a)}meta.append(title,p,nav);card.append(button,meta);$('main').append(card)});if(!visible.length)$('main').textContent='No matching frames.'}
function size(){const f=visible[current];if(!f)return;const factor=$('#zoom').value==='fit'?Math.min(1,($('.stage').clientWidth-48)/f.width):Number($('#zoom').value);$('.stage img').style.width=f.width*factor+'px'}
function open(i){current=(i+visible.length)%visible.length;const f=visible[current];$('#title').textContent=f.title+' · '+f.device;$('.stage img').src=f.file;$('.stage img').alt=f.title;$('#png').href=f.file;$('#spec').href=f.file.replace('.png','.json');if(!$('dialog').open)$('dialog').showModal();size();$('.stage').scrollTo(0,0)}
$('#query').oninput=render;$('#device').onchange=render;$('#zoom').onchange=size;$('#close').onclick=()=>$('dialog').close();$('#previous').onclick=()=>open(current-1);$('#next').onclick=()=>open(current+1);window.onresize=size;document.addEventListener('keydown',e=>{if(!$('dialog').open||e.target.matches('input,select'))return;if(e.key==='ArrowRight')open(current+1);if(e.key==='ArrowLeft')open(current-1)});render();
</script></html>
