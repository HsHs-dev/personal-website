function render(){visible=data.frames.filter(f=>($('#device').value==='all'||f.device===$('#device').value)&&(f.title+' '+f.route+' '+f.id).toLowerCase().includes($('#query').value.toLowerCase()));$('main').replaceChildren();$('.count').textContent=visible.length+' frames';visible.forEach((f,i)=>{const card=document.createElement('article');card.className='card '+f.device;const button=document.createElement('button');button.setAttribute('aria-label','View '+f.title+' '+f.device);const img=new Image();img.src=f.thumbnail;img.alt='';img.loading='lazy';button.append(img);button.onclick=()=>open(i);const meta=document.createElement('div');meta.className='meta';const title=document.createElement('h2');title.textContent=f.title;const p=document.createElement('p');p.textContent=f.device+' · '+f.width+' × '+f.height+' px';const nav=document.createElement('nav');for(const [label,url] of [['PNG',f.file],['Measurements',f.file.replace('.png','.json')],['Live interaction',f.live]]){const a=document.createElement('a');a.textContent=label;a.href=url;a.target='_blank';nav.append(a)}meta.append(title,p,nav);card.append(button,meta);$('main').append(card)});if(!visible.length)$('main').textContent='No matching frames.'}
function size(){const f=visible[current];if(!f)return;const factor=$('#zoom').value==='fit'?Math.min(1,($('.stage').clientWidth-48)/f.width):Number($('#zoom').value);$('.stage img').style.width=f.width*factor+'px'}
function open(i){current=(i+visible.length)%visible.length;const f=visible[current];$('#title').textContent=f.title+' · '+f.device;$('.stage img').src=f.file;$('.stage img').alt=f.title;$('#png').href=f.file;$('#spec').href=f.file.replace('.png','.json');if(!$('dialog').open)$('dialog').showModal();size();$('.stage').scrollTo(0,0)}
$('#query').oninput=render;$('#device').onchange=render;$('#zoom').onchange=size;$('#close').onclick=()=>$('dialog').close();$('#previous').onclick=()=>open(current-1);$('#next').onclick=()=>open(current+1);window.onresize=size;document.addEventListener('keydown',e=>{if(!$('dialog').open||e.target.matches('input,select'))return;if(e.key==='ArrowRight')open(current+1);if(e.key==='ArrowLeft')open(current-1)});render();
